name: Build APK Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure APK build
        run: |
          chmod +x ./gradlew
          printf 'INCLUDE_MAPS=false\nALL_FILES_ACCESS=true\n' > ./app.properties

      - name: Build APKs
        run: >-
          ./gradlew
          :app:assembleUniversalNoMLDebug
          :app:assembleArm64-v8aNoMLDebug
          :app:assembleArmeabi-v7aNoMLDebug
          :app:assembleX86_64NoMLDebug

      - name: Prepare APK
        id: prepare
        run: |
          VERSION_NAME=$(grep -E '^\s+versionName\s*=' app/build.gradle.kts | head -1 | awk -F\" '{ print $2 }')
          VERSION_CODE=$(grep -E '^\s+versionCode\s*=' app/build.gradle.kts | awk '{ print $3 }' | head -n 1)
          TAG="v${VERSION_NAME}-${VERSION_CODE}-apk"
          mkdir -p dist
          copy_apk() {
            PATTERN="$1"
            NAME="$2"
            APK=$(find app/build/outputs -name "$PATTERN" -type f | head -n 1)
            test -n "$APK"
            cp "$APK" "dist/Gallery-${VERSION_NAME}-${VERSION_CODE}-${NAME}.apk"
          }
          copy_apk "*universal*debug*.apk" "universal-debug"
          copy_apk "*arm64-v8a*debug*.apk" "arm64-v8a-phone-debug"
          copy_apk "*armeabi-v7a*debug*.apk" "armeabi-v7a-phone-debug"
          copy_apk "*x86_64*debug*.apk" "x86_64-emulator-debug"
          for apk in dist/*.apk; do
            zip -j -9 "${apk%.apk}.zip" "$apk"
          done
          sha256sum dist/* > dist/SHA256SUMS.txt
          {
            echo "version_name=$VERSION_NAME"
            echo "version_code=$VERSION_CODE"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gallery APK
          path: dist/*

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.prepare.outputs.tag }}
          VERSION_NAME: ${{ steps.prepare.outputs.version_name }}
          VERSION_CODE: ${{ steps.prepare.outputs.version_code }}
        run: |
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" dist/* \
            --title "Gallery ${VERSION_NAME} (${VERSION_CODE}) APK" \
            --notes "Universal debug-signed APK for Gallery. This build does not require private signing secrets and can be installed for testing."
